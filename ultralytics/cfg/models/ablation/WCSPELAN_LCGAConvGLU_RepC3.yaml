#   Backbone: WCSPELAN (双核多尺度)
#   Encoder:  LCGAConvGLU
#   Neck:     RepC3

nc: 80
scales: {l: [1.00, 1.00, 1024]}

backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0
  - [-1, 1, Conv, [128, 3, 2]]       # 1
  - [-1, 1, WCSPELAN, [128, 0.5]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3
  - [-1, 1, WCSPELAN, [256, 0.5]]   # 4-P3
  - [-1, 1, Conv, [384, 3, 2]]       # 5
  - [-1, 1, WCSPELAN, [384, 1]]     # 6-P4
  - [-1, 1, Conv, [384, 3, 2]]       # 7
  - [-1, 3, WCSPELAN, [384, 0.75]]  # 8-P5

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9 input_proj.2
  - [-1, 1, LCGAConvGLU, [1024]]                      # 10 encoder
  - [-1, 1, Conv, [256, 1, 1]]                      # 11 Y5
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]      # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]    # 13 input_proj.1
  - [[-2, -1], 1, Concat, [1]]                      # 14
  - [-1, 3, RepC3, [256, 0.5]]                      # 15 fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]                      # 16 Y4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]      # 17
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]]    # 18 input_proj.0
  - [[-2, -1], 1, Concat, [1]]                      # 19
  - [-1, 3, RepC3, [256, 0.5]]                      # 20 fpn_blocks.1
  - [-1, 1, Conv, [256, 3, 2]]                      # 21 downsample_convs.0
  - [[-1, 16], 1, Concat, [1]]                      # 22
  - [-1, 3, RepC3, [256, 0.5]]                      # 23 pan_blocks.0
  - [-1, 1, Conv, [256, 3, 2]]                      # 24 downsample_convs.1
  - [[-1, 11], 1, Concat, [1]]                      # 25
  - [-1, 3, RepC3, [256, 0.5]]                      # 26 pan_blocks.1
  - [[20, 23, 26], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
